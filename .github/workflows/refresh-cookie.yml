name: Refresh Cookie

on:
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python + Playwright
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install playwright requests playwright-stealth
          playwright install chromium --with-deps

      - name: Refresh Drime cookie
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          DRIME_HASH: GdjvdkyRKVrxyX0ahZFTm4BgBaWnR9
          WORKER_URL: https://selecta-vision-proxy.edersonff.workers.dev
        run: |
          cd worker/scripts
          python refresh_cookie.py
